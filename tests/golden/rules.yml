# Generated by agent-slo; thresholds from slo-toolkit. Review, then run:
#   promtool check rules <this file>
groups:
  - name: "agent-slo.deploy-risk"
    rules:
      - record: "agent_slo:burn_rate:ratio_6h"
        expr: "(sum by (agent) (agent_slo_window_bad{agent=\"deploy-risk\",window=\"6h\"}) / sum by (agent) (agent_slo_window_eligible{agent=\"deploy-risk\",window=\"6h\"})) / 0.1"
        labels:
          agent: "deploy-risk"
      - record: "agent_slo:burn_rate:ratio_24h"
        expr: "(sum by (agent) (agent_slo_window_bad{agent=\"deploy-risk\",window=\"24h\"}) / sum by (agent) (agent_slo_window_eligible{agent=\"deploy-risk\",window=\"24h\"})) / 0.1"
        labels:
          agent: "deploy-risk"
      - record: "agent_slo:burn_rate:ratio_72h"
        expr: "(sum by (agent) (agent_slo_window_bad{agent=\"deploy-risk\",window=\"72h\"}) / sum by (agent) (agent_slo_window_eligible{agent=\"deploy-risk\",window=\"72h\"})) / 0.1"
        labels:
          agent: "deploy-risk"
      - record: "agent_slo:burn_rate:ratio_168h"
        expr: "(sum by (agent) (agent_slo_window_bad{agent=\"deploy-risk\",window=\"168h\"}) / sum by (agent) (agent_slo_window_eligible{agent=\"deploy-risk\",window=\"168h\"})) / 0.1"
        labels:
          agent: "deploy-risk"
      - alert: "AgentSLOFastBurn"
        expr: "agent_slo:burn_rate:ratio_6h{agent=\"deploy-risk\"} > 6.0\nand on(agent) agent_slo:burn_rate:ratio_24h{agent=\"deploy-risk\"} > 6.0\nand on(agent) agent_slo_window_eligible{agent=\"deploy-risk\",window=\"6h\"} >= 5\nand on(agent) agent_slo_window_bad{agent=\"deploy-risk\",window=\"6h\"} >= 2"
        for: "5m"
        labels:
          severity: "page"
          agent: "deploy-risk"
          slo: "pass-rate"
        annotations:
          summary: "deploy-risk SLO 'pass-rate' (availability) is burning 5% of its 30d error budget in 6h (burn rate \u22656.0x) [env=production]"
      - alert: "AgentSLOSlowBurn"
        expr: "agent_slo:burn_rate:ratio_24h{agent=\"deploy-risk\"} > 3.0\nand on(agent) agent_slo:burn_rate:ratio_72h{agent=\"deploy-risk\"} > 3.0\nand on(agent) agent_slo_window_eligible{agent=\"deploy-risk\",window=\"24h\"} >= 5\nand on(agent) agent_slo_window_bad{agent=\"deploy-risk\",window=\"24h\"} >= 2"
        for: "5m"
        labels:
          severity: "ticket"
          agent: "deploy-risk"
          slo: "pass-rate"
        annotations:
          summary: "deploy-risk SLO 'pass-rate' (availability) is burning 10% of its 30d error budget in 24h (burn rate \u22653.0x) [env=production]"
      - alert: "AgentSLOTrend"
        expr: "agent_slo:burn_rate:ratio_72h{agent=\"deploy-risk\"} > 1.0\nand on(agent) agent_slo:burn_rate:ratio_168h{agent=\"deploy-risk\"} > 1.0\nand on(agent) agent_slo_window_eligible{agent=\"deploy-risk\",window=\"72h\"} >= 5\nand on(agent) agent_slo_window_bad{agent=\"deploy-risk\",window=\"72h\"} >= 2"
        for: "5m"
        labels:
          severity: "info"
          agent: "deploy-risk"
          slo: "pass-rate"
        annotations:
          summary: "deploy-risk SLO 'pass-rate' (availability) is burning 10% of its 30d error budget in 72h (burn rate \u22651.0x) [env=production]"
      - alert: "AgentSLOBudgetExhausted"
        expr: "agent_slo_budget_exhausted{agent=\"deploy-risk\"} == 1"
        for: "5m"
        labels:
          severity: "page"
          agent: "deploy-risk"
          slo: "pass-rate"
        annotations:
          summary: "deploy-risk has exhausted its 30d pass-rate error budget. Error budget policy: freeze auto-merge for this agent and require human review."
      - alert: "AgentSLOGateBlockBreach"
        expr: "agent_slo_gate_block_breach{agent=\"deploy-risk\"} == 1"
        for: "5m"
        labels:
          severity: "ticket"
          agent: "deploy-risk"
          slo: "gate-block-rate"
        annotations:
          summary: "deploy-risk gate-block rate is above 0.1 over 30d"
  - name: "agent-slo.pr-reviewer"
    rules:
      - record: "agent_slo:burn_rate:ratio_6h"
        expr: "(sum by (agent) (agent_slo_window_bad{agent=\"pr-reviewer\",window=\"6h\"}) / sum by (agent) (agent_slo_window_eligible{agent=\"pr-reviewer\",window=\"6h\"})) / 0.05"
        labels:
          agent: "pr-reviewer"
      - record: "agent_slo:burn_rate:ratio_24h"
        expr: "(sum by (agent) (agent_slo_window_bad{agent=\"pr-reviewer\",window=\"24h\"}) / sum by (agent) (agent_slo_window_eligible{agent=\"pr-reviewer\",window=\"24h\"})) / 0.05"
        labels:
          agent: "pr-reviewer"
      - record: "agent_slo:burn_rate:ratio_72h"
        expr: "(sum by (agent) (agent_slo_window_bad{agent=\"pr-reviewer\",window=\"72h\"}) / sum by (agent) (agent_slo_window_eligible{agent=\"pr-reviewer\",window=\"72h\"})) / 0.05"
        labels:
          agent: "pr-reviewer"
      - record: "agent_slo:burn_rate:ratio_168h"
        expr: "(sum by (agent) (agent_slo_window_bad{agent=\"pr-reviewer\",window=\"168h\"}) / sum by (agent) (agent_slo_window_eligible{agent=\"pr-reviewer\",window=\"168h\"})) / 0.05"
        labels:
          agent: "pr-reviewer"
      - alert: "AgentSLOFastBurn"
        expr: "agent_slo:burn_rate:ratio_6h{agent=\"pr-reviewer\"} > 6.0\nand on(agent) agent_slo:burn_rate:ratio_24h{agent=\"pr-reviewer\"} > 6.0\nand on(agent) agent_slo_window_eligible{agent=\"pr-reviewer\",window=\"6h\"} >= 5\nand on(agent) agent_slo_window_bad{agent=\"pr-reviewer\",window=\"6h\"} >= 2"
        for: "5m"
        labels:
          severity: "page"
          agent: "pr-reviewer"
          slo: "pass-rate"
        annotations:
          summary: "pr-reviewer SLO 'pass-rate' (availability) is burning 5% of its 30d error budget in 6h (burn rate \u22656.0x) [env=production]"
      - alert: "AgentSLOSlowBurn"
        expr: "agent_slo:burn_rate:ratio_24h{agent=\"pr-reviewer\"} > 3.0\nand on(agent) agent_slo:burn_rate:ratio_72h{agent=\"pr-reviewer\"} > 3.0\nand on(agent) agent_slo_window_eligible{agent=\"pr-reviewer\",window=\"24h\"} >= 5\nand on(agent) agent_slo_window_bad{agent=\"pr-reviewer\",window=\"24h\"} >= 2"
        for: "5m"
        labels:
          severity: "ticket"
          agent: "pr-reviewer"
          slo: "pass-rate"
        annotations:
          summary: "pr-reviewer SLO 'pass-rate' (availability) is burning 10% of its 30d error budget in 24h (burn rate \u22653.0x) [env=production]"
      - alert: "AgentSLOTrend"
        expr: "agent_slo:burn_rate:ratio_72h{agent=\"pr-reviewer\"} > 1.0\nand on(agent) agent_slo:burn_rate:ratio_168h{agent=\"pr-reviewer\"} > 1.0\nand on(agent) agent_slo_window_eligible{agent=\"pr-reviewer\",window=\"72h\"} >= 5\nand on(agent) agent_slo_window_bad{agent=\"pr-reviewer\",window=\"72h\"} >= 2"
        for: "5m"
        labels:
          severity: "info"
          agent: "pr-reviewer"
          slo: "pass-rate"
        annotations:
          summary: "pr-reviewer SLO 'pass-rate' (availability) is burning 10% of its 30d error budget in 72h (burn rate \u22651.0x) [env=production]"
      - alert: "AgentSLOBudgetExhausted"
        expr: "agent_slo_budget_exhausted{agent=\"pr-reviewer\"} == 1"
        for: "5m"
        labels:
          severity: "page"
          agent: "pr-reviewer"
          slo: "pass-rate"
        annotations:
          summary: "pr-reviewer has exhausted its 30d pass-rate error budget. Error budget policy: freeze auto-merge for this agent and require human review."
      - alert: "AgentSLOGateBlockBreach"
        expr: "agent_slo_gate_block_breach{agent=\"pr-reviewer\"} == 1"
        for: "5m"
        labels:
          severity: "ticket"
          agent: "pr-reviewer"
          slo: "gate-block-rate"
        annotations:
          summary: "pr-reviewer gate-block rate is above 0.1 over 30d"
  - name: "agent-slo.export"
    rules:
      - alert: "AgentSLOExportStale"
        expr: "time() - agent_slo_export_timestamp_seconds > 900\nor absent(agent_slo_export_timestamp_seconds)"
        for: "5m"
        labels:
          severity: "page"
        annotations:
          summary: "agent-slo metrics are missing or stale; burn-rate alerts cannot be trusted"
